[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vbeye"
version = "0.1.0"
description = "Public website security assessment tool (headers, TLS, source) with HTML report"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "theEreb0x" }]
keywords = ["security", "kali", "tls", "headers", "audit", "pentest"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "sslyze>=5.2",
    "rich>=13.7",
    "tldextract>=5.1",
    "python-docx>=1.1",
    "tomli>=2.0; python_version<'3.11'",
]

[project.scripts]
vbeye = "vbeye.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vbeye*"]
